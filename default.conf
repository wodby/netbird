# One address for everything users and clients reach: the dashboard, the management API, sign-in (/oauth2) and the
# gRPC services of management and signal. gRPC needs HTTP/2, so the port also accepts cleartext HTTP/2 (h2c) from a
# proxy that terminates TLS. The relay has its own address (port 8082): WebSocket can't be carried over h2c here.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    http2 on;

    root /usr/share/nginx/html;

    # Clients keep gRPC streams and requests open for as long as they are connected.
    client_header_timeout 1d;
    client_body_timeout 1d;
    keepalive_timeout 1d;
    client_max_body_size 32m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location /management.ManagementService/ {
        grpc_pass grpc://netbird_grpc;
        grpc_read_timeout 1d;
        grpc_send_timeout 1d;
        grpc_socket_keepalive on;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /signalexchange.SignalExchange/ {
        grpc_pass grpc://netbird_grpc;
        grpc_read_timeout 1d;
        grpc_send_timeout 1d;
        grpc_socket_keepalive on;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(api|oauth2)(/|$) {
        proxy_pass http://netbird_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 1h;
    }

    location = /netbird.wasm {
        default_type application/wasm;
    }

    location = /ironrdp-pkg/ironrdp_web_bg.wasm {
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # The dashboard's start script replaces this policy with one built for the configured addresses.
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss: https:;" always;
        add_header Last-Modified "";
        expires off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }
}

# The server takes gRPC and HTTP/1.1 on one port. They need separate upstreams: nginx must not reuse an idle HTTP/2
# connection for an HTTP/1.1 request or the other way round.
upstream netbird_grpc {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream netbird_http {
    server 127.0.0.1:8081;
    keepalive 32;
}
